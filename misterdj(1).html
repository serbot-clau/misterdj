<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MisterDJ">
<meta name="theme-color" content="#1A1916">
<title>MisterDJ · Control</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#F6F5F1;--surface:#fff;--s2:#F0EFE9;--border:#E3E1D9;--border2:#CCCAB8;
  --text:#1A1916;--t2:#6B6960;--t3:#9B9890;
  --green:#1A5C38;--gbg:#D8F3DC;--gbd:#A8D5B5;
  --red:#8B1A1A;--rbg:#FFE8E8;--rbd:#F4AAAA;
  --amber:#7B4F12;--abg:#FFF3CD;--abd:#F5D78A;
  --r:14px;--rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}

/* TOP BAR */
#topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;height:50px;}
#topbar h1{font-size:16px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;}
.dot{display:inline-block;width:6px;height:6px;background:var(--text);border-radius:50%;margin-right:4px;vertical-align:middle;}
.mnav{display:flex;align-items:center;gap:0;}
.mnav button{background:none;border:none;cursor:pointer;color:var(--t2);font-size:22px;line-height:1;padding:5px 8px;border-radius:8px;}
.mnav button:active{background:var(--s2);}
#monthLbl{font-size:13px;font-weight:600;min-width:120px;text-align:center;text-transform:capitalize;}
.btn-today{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;color:var(--t2);}

/* KPI STRIP */
#kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-bottom:1px solid var(--border);}
.kpi{padding:7px 8px;border-right:1px solid var(--border);}
.kpi:last-child{border-right:none;}
.kpi-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:1px;}
.kpi-val{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;}
.kpi-val.pos{color:var(--green);}
.kpi-val.neg{color:var(--red);}

/* VIEWS */
.view{display:none;padding-bottom:70px;}
.view.on{display:block;}

/* CALENDAR */
.wday-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--s2);border-bottom:1px solid var(--border);}
.wday{padding:6px 0;text-align:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--t3);}
.wday.we{color:var(--red);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cday{min-height:72px;padding:5px 4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);}
.cday:nth-child(7n){border-right:none;}
.cday:active{background:#F5F4EE;}
.cday.sel{outline:2px solid var(--text);outline-offset:-2px;background:#F0EFE4;}
.cday.emp{background:var(--s2);pointer-events:none;}
.cday.tod .dnum{background:var(--text);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
.dnum{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:3px;line-height:1;}
.cday.we-day:not(.tod) .dnum{color:#C0392B;}
.chip{border-radius:3px;padding:1px 4px;font-size:10px;font-weight:500;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;color:#fff;line-height:1.4;}
.chip.pos{background:var(--green);}
.chip.neg{background:var(--red);}
.chip.neu{background:#555;}
.pend-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#F5D78A;vertical-align:middle;margin-right:2px;}
.day-sum{font-size:9px;font-family:'DM Mono',monospace;color:var(--t3);margin-top:2px;line-height:1.3;}

/* DAY SHEET — slide up over content */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;}
#daysheet{position:fixed;left:0;right:0;bottom:0;height:85vh;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--border);box-shadow:0 -4px 24px rgba(0,0,0,.14);transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column;}
#daysheet.open{transform:translateY(0);}
.handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
#sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
#sheet-head h2{font-size:14px;font-weight:600;text-transform:capitalize;}
.btn-add{background:var(--text);color:#fff;border:none;border-radius:var(--rsm);padding:8px 13px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
#sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}
.empty-day{text-align:center;color:var(--t3);font-size:13px;padding:24px 0;}

/* SERVICE CARD */
.svc{border:1px solid var(--border);border-radius:var(--rsm);padding:12px;margin-bottom:10px;}
.svc:last-child{margin-bottom:0;}
.svc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.svc-name{font-weight:600;font-size:14px;line-height:1.3;}
.svc-tipo{font-size:11px;color:var(--t2);background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.svc-meta{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.horario{font-size:12px;font-family:'DM Mono',monospace;color:var(--t2);background:var(--s2);padding:2px 7px;border-radius:20px;border:1px solid var(--border);}
.cbadge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;border:1px solid;}
.cbadge.cob{background:var(--gbg);color:var(--green);border-color:var(--gbd);}
.cbadge.pen{background:var(--abg);color:var(--amber);border-color:var(--abd);}
.cbadge.pag{background:#E8F4FD;color:#1A5276;border-color:#AED6F1;}
.cbadge.penp{background:#FDF2F8;color:#76448A;border-color:#D7BDE2;}
.cbadge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.svc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px;}
.num{background:var(--s2);border-radius:6px;padding:6px 7px;}
.num-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--t3);margin-bottom:2px;}
.num-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;}
.num-val.pos{color:var(--green);}
.num-val.neg{color:var(--red);}
.djs-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.djp{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:500;}
.acts{display:flex;gap:6px;justify-content:flex-end;}
.btn-e,.btn-d{padding:7px 13px;border-radius:var(--rsm);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:none;}
.btn-d:active{background:var(--rbg);border-color:var(--rbd);color:var(--red);}

/* FORM — full screen */
#formsheet{position:fixed;inset:0;background:var(--surface);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:60;display:flex;flex-direction:column;overflow:hidden;}
#formsheet.open{transform:translateY(0);}
#fhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
#fhead h2{font-size:17px;font-weight:600;}
.btn-x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--t2);padding:2px 6px;line-height:1;}
#fbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px;}
#ffoot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface);flex-shrink:0;}
.btn-save{flex:1;padding:14px;background:var(--text);color:#fff;border:none;border-radius:var(--rsm);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;}
.btn-cancel-f{padding:14px 16px;background:none;color:var(--t2);border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:14px;cursor:pointer;}
.fr{margin-bottom:14px;}
.fr label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin-bottom:5px;}
.fr input,.fr select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:15px;background:var(--bg);color:var(--text);}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--border2);background:var(--surface);}
.fr-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.fr-2 .fr{margin-bottom:0;}
.cstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px;margin-bottom:14px;}
.cs-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:2px;}
.cs-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;}
.cs-val.pos{color:var(--green);}
.cs-val.neg{color:var(--red);}
.sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin-bottom:8px;display:block;}
.dj-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
.djck{display:flex;align-items:center;gap:7px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--rsm);cursor:pointer;font-size:14px;font-weight:500;background:var(--bg);user-select:none;}
.djck:active{background:var(--s2);}
.djck.on{background:var(--text);border-color:var(--text);color:#fff;}
.djck-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;flex-shrink:0;}
.djck.on .djck-dot{opacity:1;}
.divider{height:1px;background:var(--border);margin:16px 0;}

/* RESUMEN DJS */
#djs-view{padding:12px;}
.dj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.dj-cname{font-size:15px;font-weight:600;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.dj-stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.dj-stat span:last-child{font-family:'DM Mono',monospace;font-weight:500;}

/* CONFIG */
#cfg-view{padding:12px;}
.cfg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.cfg-card h3{font-size:15px;font-weight:600;margin-bottom:4px;}
.cfg-sub{font-size:12px;color:var(--t3);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);display:block;}
.djnr{display:flex;gap:8px;margin-bottom:8px;}
.djnr input{flex:1;padding:11px 12px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:14px;background:var(--bg);}
.btn-del-sm{padding:10px 13px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:13px;cursor:pointer;background:none;color:var(--red);}
.cfg-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn-add-dj{padding:10px 16px;border:1px dashed var(--border2);border-radius:var(--rsm);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;background:none;color:var(--t2);}
.btn-save-cfg{padding:10px 20px;background:var(--text);color:#fff;border:none;border-radius:var(--rsm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}

/* BOTTOM NAV */
#botnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 6px;border:none;background:none;cursor:pointer;color:var(--t3);font-family:inherit;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;gap:2px;}
.bnav.on{color:var(--text);}
.bnav-ic{font-size:20px;line-height:1;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1><span class="dot"></span>MisterDJ</h1>
  <div class="mnav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <span id="monthLbl"></span>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>
  <button class="btn-today" onclick="goToday()">Hoy</button>
  <button class="btn-today" onclick="syncFromCloud()" title="Sincronizar">⟳</button>
</div>

<!-- KPIs -->
<div id="kpis">
  <div class="kpi"><div class="kpi-lbl">Ingresos</div><div class="kpi-val pos" id="kpiIng">—</div></div>
  <div class="kpi"><div class="kpi-lbl">DJs</div><div class="kpi-val neg" id="kpiGas">—</div></div>
  <div class="kpi"><div class="kpi-lbl">Margen</div><div class="kpi-val" id="kpiMar">—</div></div>
  <div class="kpi"><div class="kpi-lbl">Servicios</div><div class="kpi-val" id="kpiSvs">0</div></div>
</div>

<!-- CALENDARIO -->
<div id="cal-view" class="view on">
  <div class="wday-row">
    <div class="wday">L</div><div class="wday">M</div><div class="wday">X</div>
    <div class="wday">J</div><div class="wday">V</div>
    <div class="wday we">S</div><div class="wday we">D</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- RESUMEN DJS -->
<div id="djs-view" class="view">
  <div id="djCards"></div>
</div>

<!-- CONFIG -->
<div id="cfg-view" class="view">
  <div class="cfg-card">
    <h3>Nombres de los DJs</h3>
    <span class="cfg-sub">Edita, añade o borra. Pulsa Guardar para aplicar.</span>
    <div id="cfgRows"></div>
    <div class="cfg-btns">
      <button class="btn-add-dj" onclick="addCfgRow()">+ Añadir DJ</button>
      <button class="btn-save-cfg" onclick="saveDjNames()">Guardar</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="botnav">
  <button class="bnav on" id="nav-cal" onclick="setView('cal')"><span class="bnav-ic">📅</span>Calendario</button>
  <button class="bnav" id="nav-djs" onclick="setView('djs')"><span class="bnav-ic">🎧</span>DJs</button>
  <button class="bnav" id="nav-cfg" onclick="setView('cfg')"><span class="bnav-ic">⚙️</span>Config</button>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeSheet()"></div>

<!-- DAY SHEET -->
<div id="daysheet">
  <div class="handle"></div>
  <div id="sheet-head">
    <h2 id="sheetTitle">—</h2>
    <button class="btn-add" onclick="openForm()">+ Añadir</button>
  </div>
  <div id="sheet-body"></div>
</div>

<!-- FORM SHEET -->
<div id="formsheet">
  <div id="fhead">
    <h2 id="fsheetTitle">Nuevo servicio</h2>
    <button class="btn-x" onclick="closeForm()">&#x2715;</button>
  </div>
  <div id="fbody">
    <div class="fr"><label>Fecha</label><input type="date" id="fFecha"></div>
    <div class="fr-2">
      <div class="fr"><label>Hora inicio</label><input type="time" id="fIni" placeholder="20:00"></div>
      <div class="fr"><label>Hora fin</label><input type="time" id="fFin" placeholder="03:00"></div>
    </div>
    <div class="fr"><label>Lugar / Nombre del evento</label><input type="text" id="fLugar" placeholder="Ej. Finca La Alameda, Madrid" autocomplete="off"></div>
    <div class="fr"><label>Tipo de evento</label>
      <select id="fTipo">
        <option>Boda</option><option>Evento de empresa</option><option>Fiesta privada</option>
        <option>Local / Club</option><option>Restaurante</option><option>Comunión / Bautizo</option><option>Otro</option>
      </select>
    </div>
    <div class="fr-2">
      <div class="fr"><label>Cobra empresa (€)</label><input type="number" id="fIng" min="0" step="0.01" placeholder="0.00" oninput="updateCalc()"></div>
      <div class="fr"><label>Paga a DJs (€)</label><input type="number" id="fGas" min="0" step="0.01" placeholder="0.00" oninput="updateCalc()"></div>
    </div>
    <div class="cstrip">
      <div><div class="cs-lbl">Ingreso</div><div class="cs-val" id="csIng">0 €</div></div>
      <div><div class="cs-lbl">Pago DJs</div><div class="cs-val" id="csGas">0 €</div></div>
      <div><div class="cs-lbl">Margen</div><div class="cs-val" id="csMar">0 €</div></div>
    </div>
    <div class="fr-2">
      <div class="fr"><label>Cobro al cliente</label>
        <select id="fCobro">
          <option value="pendiente_cobro">⏳ Pendiente de cobro</option>
          <option value="cobrado">✓ Cobrado</option>
        </select>
      </div>
      <div class="fr"><label>Pago al DJ</label>
        <select id="fPago">
          <option value="pendiente_pago">⏳ Pendiente de pago</option>
          <option value="pagado">✓ Pagado</option>
        </select>
      </div>
    </div>
    <div class="divider"></div>
    <span class="sec-lbl">DJs que trabajan</span>
    <div class="dj-grid" id="djChecks"></div>
  </div>
  <div id="ffoot">
    <button class="btn-cancel-f" onclick="closeForm()">Cancelar</button>
    <button class="btn-save" onclick="saveService()">Guardar</button>
  </div>
</div>

<script>
const KEY="mdjctrl_v10";
const API="https://script.google.com/macros/s/AKfycbyQ_qwyRYPGGBypY9VE_onyCmrp2ElXrzXNQWUMtsp1cVpGbSy5S_ONHycAtbTjvPje/exec";
let S={services:[],djs:["Sergio","Miguel","Clemente","Guillermo","David","Nixon"],vm:null,sel:null};
let editId=null;
let syncing=false;

async function apiCall(action, extra={}) {
  try {
    const res = await fetch(API, {
      method:"POST",
      body: JSON.stringify({action, ...extra})
    });
    return await res.json();
  } catch(e) {
    return {ok:false, error:e.toString()};
  }
}

function showSync(msg) {
  let el = document.getElementById("syncbar");
  if (!el) {
    el = document.createElement("div");
    el.id = "syncbar";
    el.style.cssText = "position:fixed;top:50px;left:0;right:0;z-index:100;background:#1A1916;color:#fff;text-align:center;font-size:12px;padding:6px;font-family:inherit;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function eur(v){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2}).format(Number(v)||0);}
function eurS(v){const n=Number(v)||0;return n>=1000?(n/1000).toFixed(1).replace('.',',')+' k€':Math.round(n)+' €';}
function toDay(){return new Date().toISOString().slice(0,10);}
function mk(d){const dt=typeof d==="string"?new Date(d+"T00:00:00"):d;return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");}
function mLabel(m){const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"});}
function escH(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

function saveLocal(){localStorage.setItem(KEY,JSON.stringify({services:S.services,djs:S.djs}));}
function loadLocal(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S.services=d.services||[];S.djs=d.djs&&d.djs.length?d.djs:S.djs;}}catch(e){}
  S.vm=mk(new Date());S.sel=toDay();
}

async function syncFromCloud(){
  showSync("☁️ Sincronizando datos...");
  const [r1, r2] = await Promise.all([
    apiCall("getAll"),
    apiCall("getDjs")
  ]);
  if(r1.ok && r1.data){
    S.services = r1.data.map(s=>({...s, djs: Array.isArray(s.djs)?s.djs:[]}));
  }
  if(r2.ok && r2.djs && r2.djs.length){
    S.djs = r2.djs;
  }
  saveLocal();
  showSync("");
  render();
}

async function pushService(svc){
  showSync("☁️ Guardando...");
  const r = await apiCall("save", {svc});
  if(!r.ok) alert("Error al guardar en la nube: "+r.error);
  showSync("");
}

async function pushDelete(id){
  showSync("☁️ Borrando...");
  const r = await apiCall("delete", {id});
  if(!r.ok) alert("Error al borrar en la nube: "+r.error);
  showSync("");
}

async function pushDjs(){
  showSync("☁️ Guardando DJs...");
  const r = await apiCall("saveDjs", {djs: S.djs});
  if(!r.ok) alert("Error al guardar DJs: "+r.error);
  showSync("");
}

function changeMonth(d){const[y,m]=S.vm.split("-").map(Number);S.vm=mk(new Date(y,m-1+d,1));render();}
function goToday(){S.vm=mk(new Date());S.sel=toDay();render();}

function mSvcs(){return S.services.filter(s=>s.date&&mk(s.date)===S.vm);}
function dSvcs(date){return S.services.filter(s=>s.date===date);}

function render(){
  saveLocal();
  document.getElementById("monthLbl").textContent=mLabel(S.vm);
  renderKPIs();
  renderCal();
}

function renderKPIs(){
  const cs=mSvcs();
  const ing=cs.reduce((a,s)=>a+Number(s.ing||0),0);
  const gas=cs.reduce((a,s)=>a+Number(s.gas||0),0);
  const mar=ing-gas;
  document.getElementById("kpiIng").textContent=eurS(ing);
  document.getElementById("kpiGas").textContent=eurS(gas);
  const km=document.getElementById("kpiMar");
  km.textContent=eurS(mar);km.className="kpi-val"+(mar>=0?" pos":" neg");
  document.getElementById("kpiSvs").textContent=cs.length;
}

function renderCal(){
  const[y,m]=S.vm.split("-").map(Number);
  const first=new Date(y,m-1,1),last=new Date(y,m,0);
  const offset=(first.getDay()+6)%7;
  const td=toDay();
  const grid=document.getElementById("calGrid");
  grid.innerHTML="";
  for(let i=0;i<offset;i++){const e=document.createElement("div");e.className="cday emp";grid.appendChild(e);}
  for(let d=1;d<=last.getDate();d++){
    const ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dow=(new Date(y,m-1,d).getDay()+6)%7;
    const svcs=dSvcs(ds);
    const ing=svcs.reduce((a,s)=>a+Number(s.ing||0),0);
    const gas=svcs.reduce((a,s)=>a+Number(s.gas||0),0);
    const el=document.createElement("div");
    let cls="cday";
    if(ds===td)cls+=" tod";
    if(ds===S.sel)cls+=" sel";
    if(dow>=5)cls+=" we-day";
    el.className=cls;
    el.onclick=()=>{S.sel=ds;renderCal();openSheet(ds);};
    let html=`<div class="dnum">${d}</div>`;
    svcs.slice(0,2).forEach(s=>{
      const sm=Number(s.ing||0)-Number(s.gas||0);
      const cc=sm>0?"chip pos":sm<0?"chip neg":"chip neu";
      const pd=s.cobro!=="cobrado"?`<span class="pend-dot"></span>`:"";
      const pp=s.pago!=="pagado"?`<span class="pend-dot" style="background:#D7BDE2;"></span>`:"";
      html+=`<span class="${cc}">${pd}${pp}${escH(s.lugar||"Servicio")}</span>`;
    });
    if(svcs.length>2)html+=`<div class="day-sum">+${svcs.length-2} más</div>`;
    else if(svcs.length)html+=`<div class="day-sum">${eur(ing)}</div>`;
    el.innerHTML=html;
    grid.appendChild(el);
  }
  const rem=(offset+last.getDate())%7;
  if(rem>0)for(let i=0;i<7-rem;i++){const e=document.createElement("div");e.className="cday emp";grid.appendChild(e);}
}

function openSheet(date){
  S.sel=date;
  const dt=new Date(date+"T00:00:00");
  document.getElementById("sheetTitle").textContent=dt.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  renderSheetBody();
  document.getElementById("daysheet").classList.add("open");
  document.getElementById("overlay").style.display="block";
}
function closeSheet(){
  document.getElementById("daysheet").classList.remove("open");
  document.getElementById("overlay").style.display="none";
}

function renderSheetBody(){
  const svcs=dSvcs(S.sel);
  const box=document.getElementById("sheet-body");
  if(!svcs.length){box.innerHTML='<div class="empty-day">Sin servicios este día.<br>Pulsa "+ Añadir" para crear uno.</div>';return;}
  box.innerHTML=svcs.map(s=>{
    const ing=Number(s.ing||0),gas=Number(s.gas||0),mar=ing-gas;
    const cob=s.cobro==="cobrado";
    const pag=s.pago==="pagado";
    const hor=(s.ini&&s.fin)?`<span class="horario">⏱ ${s.ini}–${s.fin}</span>`:(s.ini?`<span class="horario">⏱ ${s.ini}</span>`:"");
    const djsH=(s.djs||[]).map(d=>`<span class="djp">${escH(d)}</span>`).join("");
    return `<div class="svc">
      <div class="svc-top"><div class="svc-name">${escH(s.lugar||"Sin nombre")}</div><span class="svc-tipo">${escH(s.tipo||"")}</span></div>
      <div class="svc-meta">${hor}</div>
      <div class="svc-badges">
        <span class="cbadge ${cob?"cob":"pen"}"><span class="cbadge-dot"></span>${cob?"Cobrado":"Pendiente cobro"}</span>
        <span class="cbadge ${pag?"pag":"penp"}"><span class="cbadge-dot"></span>${pag?"DJ pagado":"DJ pendiente"}</span>
      </div>
      <div class="nums">
        <div class="num"><div class="num-lbl">Ingreso</div><div class="num-val">${eur(ing)}</div></div>
        <div class="num"><div class="num-lbl">Pago DJs</div><div class="num-val">${eur(gas)}</div></div>
        <div class="num"><div class="num-lbl">Margen</div><div class="num-val ${mar>=0?"pos":"neg"}">${eur(mar)}</div></div>
      </div>
      ${djsH?`<div class="djs-row">${djsH}</div>`:""}
      <div class="acts">
        <button class="btn-e" onclick="editSvc('${s.id}')">Editar</button>
        <button class="btn-d" onclick="delSvc('${s.id}')">Borrar</button>
      </div>
    </div>`;
  }).join("");
}

function openForm(){
  editId=null;
  document.getElementById("fsheetTitle").textContent="Nuevo servicio";
  document.getElementById("fFecha").value=S.sel||toDay();
  document.getElementById("fIni").value="";
  document.getElementById("fFin").value="";
  document.getElementById("fLugar").value="";
  document.getElementById("fTipo").value="Boda";
  document.getElementById("fIng").value="";
  document.getElementById("fGas").value="";
  document.getElementById("fCobro").value="pendiente_cobro";
  document.getElementById("fPago").value="pendiente_pago";
  updateCalc();
  renderDjChecks([]);
  document.getElementById("formsheet").classList.add("open");
}

function editSvc(id){
  const s=S.services.find(x=>x.id===id);if(!s)return;
  editId=id;
  document.getElementById("fsheetTitle").textContent="Editar servicio";
  document.getElementById("fFecha").value=s.date||"";
  document.getElementById("fIni").value=s.ini||"";
  document.getElementById("fFin").value=s.fin||"";
  document.getElementById("fLugar").value=s.lugar||"";
  document.getElementById("fTipo").value=s.tipo||"Boda";
  document.getElementById("fIng").value=s.ing||"";
  document.getElementById("fGas").value=s.gas||"";
  document.getElementById("fCobro").value=s.cobro||"pendiente_cobro";
  document.getElementById("fPago").value=s.pago||"pendiente_pago";
  updateCalc();
  renderDjChecks(s.djs||[]);
  document.getElementById("formsheet").classList.add("open");
}

function closeForm(){document.getElementById("formsheet").classList.remove("open");}

async function saveService(){
  const fecha=document.getElementById("fFecha").value;
  const lugar=document.getElementById("fLugar").value.trim();
  if(!fecha){alert("Selecciona una fecha.");return;}
  if(!lugar){alert("Escribe el lugar o nombre del evento.");return;}
  const svc={
    id:editId||uid(),date:fecha,
    ini:document.getElementById("fIni").value,
    fin:document.getElementById("fFin").value,
    lugar,tipo:document.getElementById("fTipo").value,
    ing:document.getElementById("fIng").value,
    gas:document.getElementById("fGas").value,
    cobro:document.getElementById("fCobro").value,
    pago:document.getElementById("fPago").value,
    djs:getSelDjs()
  };
  if(editId){const i=S.services.findIndex(x=>x.id===editId);if(i>=0)S.services[i]=svc;}
  else S.services.push(svc);
  S.sel=fecha;S.vm=mk(fecha);
  closeForm();render();renderSheetBody();
  await pushService(svc);
}

async function delSvc(id){
  if(!confirm("¿Borrar este servicio?"))return;
  S.services=S.services.filter(s=>s.id!==id);
  render();renderSheetBody();
  await pushDelete(id);
}

function updateCalc(){
  const ing=Number(document.getElementById("fIng").value||0);
  const gas=Number(document.getElementById("fGas").value||0);
  const mar=ing-gas;
  document.getElementById("csIng").textContent=eur(ing);
  document.getElementById("csGas").textContent=eur(gas);
  const cm=document.getElementById("csMar");
  cm.textContent=eur(mar);cm.className="cs-val"+(mar>=0?" pos":" neg");
}

function renderDjChecks(active){
  document.getElementById("djChecks").innerHTML=S.djs.map(d=>`
    <label class="djck ${active.includes(d)?"on":""}" onclick="this.classList.toggle('on')">
      <span class="djck-dot"></span><span>${escH(d)}</span>
    </label>`).join("");
}
function getSelDjs(){return[...document.querySelectorAll(".djck.on")].map(el=>el.querySelector("span:last-child").textContent);}

function setView(v){
  ["cal","djs","cfg"].forEach(id=>{
    document.getElementById(id+"-view").classList.toggle("on",id===v);
    document.getElementById("nav-"+id).classList.toggle("on",id===v);
  });
  document.querySelector(".mnav").style.visibility=v==="cal"?"visible":"hidden";
  if(v==="djs")renderDjCards();
  if(v==="cfg")renderCfgRows();
}

function renderDjCards(){
  const cs=mSvcs();
  const map={};
  S.djs.forEach(d=>{map[d]={svcs:0,gas:0};});
  cs.forEach(s=>{
    const n=(s.djs||[]).length;
    const gpp=n>0?Number(s.gas||0)/n:0;
    (s.djs||[]).forEach(d=>{if(!map[d])map[d]={svcs:0,gas:0};map[d].svcs++;map[d].gas+=gpp;});
  });
  document.getElementById("djCards").innerHTML=S.djs.map(d=>`
    <div class="dj-card">
      <div class="dj-cname">${escH(d)}</div>
      <div class="dj-stat"><span>Servicios este mes</span><span>${map[d]?.svcs||0}</span></div>
      <div class="dj-stat"><span>Cobrado estimado</span><span>${eur(map[d]?.gas||0)}</span></div>
    </div>`).join("");
}

function renderCfgRows(){
  document.getElementById("cfgRows").innerHTML=S.djs.map((d,i)=>`
    <div class="djnr">
      <input id="djn${i}" type="text" value="${escH(d)}" placeholder="Nombre DJ">
      <button class="btn-del-sm" onclick="removeCfgRow(${i})">Borrar</button>
    </div>`).join("");
}
function addCfgRow(){collectNames();S.djs.push("");renderCfgRows();const el=document.getElementById("djn"+(S.djs.length-1));if(el)el.focus();}
function removeCfgRow(i){collectNames();if(S.djs.length<=1){alert("Debe haber al menos un DJ.");return;}S.djs.splice(i,1);renderCfgRows();}
function collectNames(){const n=[];S.djs.forEach((_,i)=>{const el=document.getElementById("djn"+i);if(el&&el.value.trim())n.push(el.value.trim());});if(n.length)S.djs=n;}
async function saveDjNames(){collectNames();saveLocal();renderDjChecks([]);await pushDjs();alert("DJs guardados.");}

/* swipe down to close sheet */
let _sy=0;
document.getElementById("daysheet").addEventListener("touchstart",e=>{_sy=e.touches[0].clientY;},{passive:true});
document.getElementById("daysheet").addEventListener("touchend",e=>{if(e.changedTouches[0].clientY-_sy>60)closeSheet();},{passive:true});

loadLocal();render();
syncFromCloud();
</script>
</body>
</html>
